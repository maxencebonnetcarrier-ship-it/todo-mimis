<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do des Mimis</title>
<style>
  :root{
    --bg:#14161a; --card:#1c1f26; --line:#2a2e37; --txt:#f2f3f5; --muted:#9aa0aa;
    --haute:#e5484d; --moyenne:#f5a623; --basse:#3fa45b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt);
    display:flex; flex-direction:column; min-height:100%;
  }
  header{padding:14px 16px 8px}
  h1{font-size:18px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center}
  h1 .count{font-size:14px; color:var(--muted); font-weight:500}
  .controls{display:flex; flex-direction:column; gap:8px}
  button{font-size:17px; border:0; border-radius:14px; padding:14px; cursor:pointer; color:#fff}
  #mic{background:var(--haute); font-size:20px; font-weight:600}
  #mic.rec{background:#b23; animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  #go{background:var(--basse); font-weight:600}
  textarea{width:100%; font-size:17px; padding:11px; border-radius:12px; border:1px solid var(--line);
    background:#0f1115; color:var(--txt); min-height:60px; resize:vertical}
  .row2{display:flex; gap:8px}
  select{flex:1; font-size:15px; padding:11px; border-radius:12px; border:1px solid var(--line);
    background:#0f1115; color:var(--txt)}
  #status{min-height:20px; font-size:14px; color:var(--muted); text-align:center; margin-top:4px}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin-top:6px; opacity:.8}
  #confirm{margin-top:8px}
  #confirm:empty{margin:0}
  .cfTitle{font-size:14px; margin:4px 0 6px; text-align:center}
  .cfRow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line)}
  .cfTx{flex:1; font-size:14px}
  .cfDel{background:var(--haute); font-size:14px; padding:8px 12px; width:auto; margin:0; border-radius:10px}
  .cfCancel{background:#3a3f49; font-size:14px; padding:10px; margin-top:8px; border-radius:10px}
  .listwrap{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0 16px}
  .item{position:relative; overflow:hidden; border-bottom:1px solid var(--line)}
  .body{display:flex; align-items:center; gap:10px; padding:9px 16px; background:var(--bg);
    transition:transform .15s ease; touch-action:pan-y; position:relative; z-index:1}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .tx{flex:1; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .meta{font-size:11px; color:var(--muted); flex:0 0 auto}
  .rowdone{position:absolute; top:0; right:0; bottom:0; width:112px; border:0; border-radius:0;
    padding:0; margin:0; background:var(--basse); color:#fff; font-size:14px; font-weight:600; z-index:0}
  .rowsnooze{position:absolute; top:0; left:0; bottom:0; width:112px; border:0; border-radius:0;
    padding:0; margin:0; background:var(--moyenne); color:#1c1c1e; font-size:14px; font-weight:600; z-index:0}
  .empty{padding:20px 16px; color:var(--muted)}
  /* fiche d'edition (clic sur une tache) */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:10}
  #modal[hidden]{display:none}
  .sheet{width:100%; background:var(--card); border-radius:18px 18px 0 0; padding:16px 16px 22px;
    display:flex; flex-direction:column; gap:10px; max-height:88%; overflow-y:auto}
  .mTitle{font-size:16px; font-weight:600; margin-bottom:2px}
  .fld{display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--muted)}
  .fld select, .fld input{font-size:16px; padding:11px; border-radius:12px; border:1px solid var(--line);
    background:#0f1115; color:var(--txt); width:100%}
  #mSave{background:var(--basse); font-weight:600}
  #mDone{background:#2f6fdb; font-weight:600}
  #mDel{background:var(--haute)}
  #mCancel{background:#3a3f49}
  .sheetlink{display:block; text-align:center; padding:12px; color:var(--muted); font-size:14px;
    text-decoration:none; border-top:1px solid var(--line)}
  /* mode compact (tuile widget) : cacher les contrôles d'ajout */
  body.compact header .controls, body.compact #status, body.compact .sheetlink{display:none}
  body.compact header{padding:10px 14px 4px}
  body.compact h1{font-size:15px}
  body.compact .item{padding:5px 14px; font-size:13px}
  body.compact .tx{font-size:13px}
</style>
</head>
<body>
<header>
  <h1><span>To-do des Mimis</span><span class="count" id="count"></span></h1>
  <div class="controls">
    <button id="mic">🎤 Parler</button>
    <textarea id="t" placeholder="Dis ou écris la tâche…"></textarea>
    <div class="row2">
      <select id="prio"><option>Haute</option><option selected>Moyenne</option><option>Basse</option></select>
      <select id="own"><option value="">Qui ?</option><option>Maxence</option><option>Marine</option><option>Maxence + Marine</option></select>
    </div>
    <button id="go">Ajouter au Sheet</button>
    <div id="status"></div>
    <div id="confirm"></div>
  </div>
</header>
<div class="listwrap" id="list"><div class="empty">Chargement…</div></div>
<div id="modal" hidden>
  <div class="sheet">
    <div class="mTitle" id="mTitle"></div>
    <label class="fld">Priorité
      <select id="mPrio"><option>Haute</option><option>Moyenne</option><option>Basse</option></select>
    </label>
    <label class="fld">Qui ?
      <select id="mOwn"><option value="">—</option><option>Maxence</option><option>Marine</option><option>Maxence + Marine</option></select>
    </label>
    <label class="fld">Date butoir
      <input type="date" id="mDate">
    </label>
    <button id="mSave">Enregistrer</button>
    <button id="mDone">✅ Terminé (classé)</button>
    <button id="mDel">Supprimer définitivement</button>
    <button id="mCancel">Annuler</button>
  </div>
</div>

<a class="sheetlink" id="sheet" href="https://docs.google.com/spreadsheets/d/1HxBL95w047MpT2EqbSjNVcW-_FJBUQH22PdxkjSfQ7o/edit" target="_blank" rel="noopener">✎ Ouvrir le Sheet (tout modifier)</a>

<script>
  var EXEC = "https://script.google.com/macros/s/AKfycbxU535e3IPWFkmDDj-jHNspuVNjdbrbtYhOHA162v7xYri66DM5ytRdwMU2IXxfV2ct7A/exec";
  // Le jeton n'est PAS dans le code (depot public). Il arrive via le # de l'URL
  // (icone "Parler" : .../#monjeton), jamais envoye au serveur, puis memorise en local.
  var TOKEN = "";
  (function(){
    var h = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
    if (h) { TOKEN = h; try { localStorage.setItem("mimi_token", h); } catch(e){} }
    else { try { TOKEN = localStorage.getItem("mimi_token") || ""; } catch(e){} }
  })();
  var ORDER = { "Haute":0, "Moyenne":1, "Basse":2 };
  var COLOR = { "Haute":"var(--haute)", "Moyenne":"var(--moyenne)", "Basse":"var(--basse)" };

  if (new URLSearchParams(location.search).get("compact") === "1") document.body.classList.add("compact");

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmtDate(v){
    if(!v) return "";
    var d=new Date(v);
    if(!isNaN(d.getTime()) && String(v).length>6){
      return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2);
    }
    return String(v).trim();
  }

  function isoOf(v){
    if(!v) return "";
    var d=new Date(v);
    if(!isNaN(d.getTime()) && String(v).length>6){
      return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    }
    var m=String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2) : "";
  }
  function frOf(iso){
    var p=String(iso||"").split("-");
    return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : "";
  }

  var CURRENT = [];
  function render(rows){
    var items = [];
    for (var i=1;i<rows.length;i++){
      var r = rows[i];
      var tache = (r[0]||"").toString().trim(); if(!tache) continue;
      var etat = (r[1]||"").toString().toLowerCase();
      if (etat.indexOf("termin")!==-1 || etat.indexOf("fait")!==-1) continue;
      items.push({row:i+1, tache:tache, etat:(r[1]||"").toString(), prop:(r[2]||"").toString(),
        date:fmtDate(r[3]), dateISO:isoOf(r[3]), prio:(r[4]||"").toString()});
    }
    items.sort(function(a,b){ return (ORDER[a.prio]==null?9:ORDER[a.prio])-(ORDER[b.prio]==null?9:ORDER[b.prio]); });
    CURRENT = items;
    document.getElementById("count").textContent = items.length;
    var html = items.map(function(it, idx){
      return '<div class="item">'
        + '<button class="rowsnooze" data-idx="'+idx+'">📅 Demain</button>'
        + '<div class="body">'
        + '<span class="dot" style="background:'+(COLOR[it.prio]||"#888")+'"></span>'
        + '<span class="tx">'+esc(it.tache)+'</span>'
        + '<span class="meta">'+(it.date?"📅 "+esc(it.date)+" · ":"")+esc(it.prop)+'</span>'
        + '</div>'
        + '<button class="rowdone" data-idx="'+idx+'">✅ Terminé</button>'
        + '</div>';
    }).join("");
    document.getElementById("list").innerHTML = html || '<div class="empty">Rien à faire 🎉</div>';
    attachSwipe();
  }

  var opened = null;
  function attachSwipe(){
    opened = null;
    var items = document.querySelectorAll("#list .item");
    items.forEach(function(it){
      var body = it.querySelector(".body");
      var done = it.querySelector(".rowdone");
      var sno = it.querySelector(".rowsnooze");
      if(!body) return;
      var startX=0, cur=0, drag=false, pos=0, moved=0; // pos: -112 terminé · 0 · 112 demain
      function setX(x){ body.style.transform = "translateX("+x+"px)"; }
      function openAt(p){ if(opened && opened!==body) opened.style.transform="translateX(0)"; pos=p; setX(p); opened = (p!==0)?body:null; }
      body.addEventListener("pointerdown", function(e){ startX=e.clientX; cur=pos; drag=true; moved=0; body.style.transition="none"; try{body.setPointerCapture(e.pointerId);}catch(_){} });
      body.addEventListener("pointermove", function(e){ if(!drag) return; var dx=e.clientX-startX; moved=Math.max(moved,Math.abs(dx)); cur=Math.min(112,Math.max(-112, pos+dx)); setX(cur); });
      body.addEventListener("pointerup", function(){
        if(!drag) return; drag=false; body.style.transition="transform .15s ease";
        if(cur < -56) openAt(-112);
        else if(cur > 56) openAt(112);
        else { var wasOpen = (pos!==0); openAt(0); if(!wasOpen && moved < 8) openEditor(+body.parentNode.querySelector(".rowdone").dataset.idx); }
      });
      body.addEventListener("pointercancel", function(){ drag=false; body.style.transition="transform .15s ease"; openAt(0); });
      if(done) done.addEventListener("click", function(){ var it2=CURRENT[+done.dataset.idx]; if(it2) doDone(it2, document.getElementById("status")); });
      if(sno) sno.addEventListener("click", function(){ var it2=CURRENT[+sno.dataset.idx]; if(it2) doSnooze(it2, document.getElementById("status")); });
    });
  }

  // Le Apps Script ne sait pas modifier une ligne : on recree la tache avec les
  // nouvelles valeurs, puis on supprime l'ancienne ligne.
  function replaceTask(item, ch, s, okMsg){
    if(!TOKEN){ s.textContent="Ouvre via l'icône « Parler » (jeton manquant)"; return; }
    s.textContent="Mise à jour…";
    var p = {
      token: TOKEN,
      tache: item.tache,
      proprietaire: (ch.prop != null ? ch.prop : item.prop),
      priorite: (ch.prio != null ? ch.prio : item.prio),
      etat: (ch.etat != null ? ch.etat : item.etat),
      dateLimite: frOf(ch.dateISO != null ? ch.dateISO : item.dateISO)
    };
    fetch(EXEC,{method:"POST",body:JSON.stringify(p)})
      .then(function(r){return r.json();})
      .then(function(r){
        if(!r.ok) throw new Error(r.error||"ajout");
        return fetch(EXEC,{method:"POST",body:JSON.stringify({token:TOKEN, action:"delete", row:item.row, expect:item.tache})}).then(function(x){return x.json();});
      })
      .then(function(r2){ s.textContent=(r2 && !r2.ok) ? ("Modifiée mais ancienne ligne restée : "+r2.error) : okMsg; load(); })
      .catch(function(e){ s.textContent="Erreur : "+e.message; });
  }

  function doSnooze(item, s){
    var d=new Date(); d.setDate(d.getDate()+1);
    var iso=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    replaceTask(item, {dateISO:iso}, s, "Reportée à demain ✅");
  }

  function doDone(item, s){
    replaceTask(item, {etat:"Terminé"}, s, "Terminée et classée ✅");
  }

  // Fiche d'edition : clic sur une tache
  var EDIT = null;
  function openEditor(idx){
    var it = CURRENT[idx]; if(!it) return;
    EDIT = it;
    document.getElementById("mTitle").textContent = it.tache;
    document.getElementById("mPrio").value = (ORDER[it.prio]!=null ? it.prio : "Moyenne");
    document.getElementById("mOwn").value = ["Maxence","Marine","Maxence + Marine"].indexOf(it.prop)!==-1 ? it.prop : "";
    document.getElementById("mDate").value = it.dateISO || "";
    document.getElementById("modal").hidden = false;
  }
  function closeEditor(){ document.getElementById("modal").hidden = true; EDIT = null; }

  document.getElementById("mCancel").addEventListener("click", closeEditor);
  document.getElementById("modal").addEventListener("click", function(e){ if(e.target.id==="modal") closeEditor(); });
  document.getElementById("mSave").addEventListener("click", function(){
    var it=EDIT; if(!it) return;
    var ch = {
      prio: document.getElementById("mPrio").value,
      prop: document.getElementById("mOwn").value,
      dateISO: document.getElementById("mDate").value
    };
    closeEditor();
    replaceTask(it, ch, document.getElementById("status"), "Modifiée ✅");
  });
  document.getElementById("mDone").addEventListener("click", function(){
    var it=EDIT; if(!it) return; closeEditor(); doDone(it, document.getElementById("status"));
  });
  document.getElementById("mDel").addEventListener("click", function(){
    var it=EDIT; if(!it) return; closeEditor(); doDelete(it.row, it.tache, document.getElementById("status"));
  });

  function load(){
    fetch(EXEC+"?json=1").then(function(r){return r.json();}).then(function(d){
      if(d && d.ok) render(d.taches);
    }).catch(function(){});
  }

  var rec=null;
  document.getElementById("mic").addEventListener("click", function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var s = document.getElementById("status");
    if(!SR){ s.textContent="Reco vocale non dispo ici — écris à la main"; return; }
    var btn=this;
    rec=new SR(); rec.lang="fr-FR"; rec.interimResults=false;
    btn.classList.add("rec"); btn.textContent="🎤 Écoute…";
    rec.onresult=function(ev){ document.getElementById("t").value=ev.results[0][0].transcript; };
    rec.onend=function(){ btn.classList.remove("rec"); btn.textContent="🎤 Parler"; };
    rec.onerror=function(ev){ btn.classList.remove("rec"); btn.textContent="🎤 Parler"; s.textContent="Micro : "+ev.error; };
    rec.start();
  });

  var DEL = /^(supprim\w*|enlev\w*|enlève|retir\w*|effac\w*|termin\w*|fini\w*)\s+(.+)$/i;

  function addTask(t, s){
    var p = { token:TOKEN, tache:t, priorite:document.getElementById("prio").value, proprietaire:document.getElementById("own").value };
    s.textContent="Ajout en cours…";
    fetch(EXEC, {method:"POST", body:JSON.stringify(p)})
      .then(function(r){return r.json();})
      .then(function(r){
        if(r.ok){ s.textContent="Ajoutée ✅"; document.getElementById("t").value=""; load(); }
        else s.textContent="Erreur : "+r.error;
      })
      .catch(function(e){ s.textContent="Erreur réseau : "+e.message; });
  }

  function askDelete(q, s){
    s.textContent="Recherche de « "+q+" »…";
    fetch(EXEC, {method:"POST", body:JSON.stringify({token:TOKEN, action:"search", match:q})})
      .then(function(r){return r.json();})
      .then(function(r){
        if(!r.ok){ s.textContent="Erreur : "+r.error; return; }
        if(!r.matches.length){ s.textContent="Aucune tâche pour « "+q+" »"; return; }
        showConfirm(r.matches, s);
      })
      .catch(function(e){ s.textContent="Erreur réseau : "+e.message; });
  }

  function showConfirm(matches, s){
    var box=document.getElementById("confirm"); box.innerHTML="";
    s.textContent="";
    var title=document.createElement("div"); title.className="cfTitle";
    title.textContent = matches.length>1 ? "Supprimer laquelle ?" : "Supprimer cette tâche ?";
    box.appendChild(title);
    matches.forEach(function(m){
      var row=document.createElement("div"); row.className="cfRow";
      var lbl=document.createElement("span"); lbl.className="cfTx"; lbl.textContent=m.tache; row.appendChild(lbl);
      var b=document.createElement("button"); b.className="cfDel"; b.textContent="Supprimer";
      b.onclick=function(){ doDelete(m.row, m.tache, s); };
      row.appendChild(b); box.appendChild(row);
    });
    var cancel=document.createElement("button"); cancel.className="cfCancel"; cancel.textContent="Annuler";
    cancel.onclick=function(){ box.innerHTML=""; };
    box.appendChild(cancel);
  }

  function doDelete(row, expect, s){
    s.textContent="Suppression…";
    fetch(EXEC, {method:"POST", body:JSON.stringify({token:TOKEN, action:"delete", row:row, expect:expect})})
      .then(function(r){return r.json();})
      .then(function(r){
        document.getElementById("confirm").innerHTML="";
        if(r.ok){ s.textContent="Supprimée ✅"; document.getElementById("t").value=""; load(); }
        else s.textContent="Erreur : "+r.error;
      })
      .catch(function(e){ s.textContent="Erreur réseau : "+e.message; });
  }

  document.getElementById("go").addEventListener("click", function(){
    var t = document.getElementById("t").value.trim();
    var s = document.getElementById("status");
    if(!t){ s.textContent="Rien à faire"; return; }
    if(!TOKEN){ s.textContent="Ouvre via l'icône « Parler » (jeton manquant)"; return; }
    var m = t.match(DEL);
    if(m){ askDelete(m[2].trim(), s); } else { addTask(t, s); }
  });

  load();
  setInterval(load, 60000);
</script>
</body>
</html>
